<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Feuerwehrknoten Roulette</title>
    
    <!-- iOS WebApp PWA Optimization -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Knoten Roulette">
    <meta name="theme-color" content="#0d0d11">
    
    <style>
        :root {
            --bg-color: #0d0d11;
            --card-bg: rgba(25, 25, 35, 0.75);
            --primary-red: #e50914;
            --accent-gold: #ffcc00;
            --text-light: #f5f5f7;
            --text-dim: #a1a1a6;
            --border-glow: rgba(229, 9, 20, 0.3);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(229, 9, 20, 0.15), transparent 70%),
                radial-gradient(circle at 50% 100%, rgba(20, 20, 30, 0.8), transparent 80%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        header {
            margin-top: calc(env(safe-area-inset-top, 20px) + 15px);
            text-align: center;
            padding: 0 20px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 4px 0;
            background: linear-gradient(180deg, #ffffff 0%, #d1d1d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 500;
            margin: 0;
            letter-spacing: 0.2px;
        }

        /* Roulette Wheel Outer Frame */
        .wheel-stage {
            position: relative;
            margin: 25px auto 15px auto;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-glow {
            position: absolute;
            width: 310px;
            height: 310px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(229, 9, 20, 0.2) 0%, transparent 70%);
            filter: blur(10px);
            z-index: 1;
        }

        /* The iOS Pointer Pin */
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 32px;
            z-index: 20;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.8));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 28px solid var(--primary-red);
        }

        #wheel-canvas {
            position: relative;
            z-index: 10;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 0 6px rgba(255, 255, 255, 0.05);
            transition: transform 4.5s cubic-bezier(0.15, 0.85, 0.15, 1);
            transform: rotate(0deg);
        }

        /* Center Wheel Pin */
        .center-pin {
            position: absolute;
            width: 44px;
            height: 44px;
            background: radial-gradient(circle, #2c2c36 0%, #111116 100%);
            border: 3px solid #3a3a4c;
            border-radius: 50%;
            z-index: 15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-pin::after {
            content: '';
            width: 14px;
            height: 14px;
            background: var(--primary-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary-red);
        }

        /* Spin Controls */
        .spin-btn {
            background: linear-gradient(180deg, #e50914 0%, #b20710 100%);
            color: white;
            border: none;
            padding: 16px 42px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-top: 10px;
            letter-spacing: 0.3px;
        }

        .spin-btn:active {
            transform: scale(0.94);
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3);
        }

        .spin-btn:disabled {
            background: #2c2c35;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Result Card Area */
        #result-area {
            margin-top: 20px;
            width: 90%;
            max-width: 360px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: all 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            pointer-events: none;
        }

        #result-area.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .result-tag {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-gold);
            margin-bottom: 6px;
        }

        #knot-name {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        #knot-desc {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.4;
            margin-bottom: 18px;
        }

        .video-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: background 0.2s, transform 0.15s;
        }

        .video-btn:active {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(0.98);
        }

        /* Video Modal */
        #video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .close-btn {
            position: absolute;
            top: calc(env(safe-area-inset-top, 20px) + 15px);
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .iframe-container {
            width: 100%;
            max-width: 560px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Feuerwehrknoten</h1>
        <p class="subtitle">Roulette nach FwDV 1 & Feuerwehr Lernbar</p>
    </header>

    <div class="wheel-stage">
        <div class="wheel-glow"></div>
        <div class="pointer"></div>
        <canvas id="wheel-canvas" width="600" height="600"></canvas>
        <div class="center-pin"></div>
    </div>

    <button id="spin-btn" class="spin-btn">Knoten Drehen</button>

    <div id="result-area">
        <div class="result-tag">Ausgewählter Knoten</div>
        <div id="knot-name"></div>
        <div id="knot-desc"></div>
        <button id="video-btn" class="video-btn">
            ▶ Erklärvideo ansehen
        </button>
    </div>

    <!-- Video Modal -->
    <div id="video-modal">
        <button class="close-btn" id="close-modal">&times;</button>
        <div class="iframe-container">
            <iframe id="yt-iframe" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Exakte Knotenliste (10 Knoten) mit gepflegten Lernbar & Feuerwehr-Lehrvideos
        const knots = [
            { name: "Mastwurf gestochen", video: "_8CKJrBWJTM", desc: "Befestigungsknoten zum Anschlagen an Objekten (z. B. Pfahl oder Holz)." },
            { name: "Mastwurf gelegt", video: "gqkZywQvbWg", desc: "Zum Anschlagen an offenen Enden (z. B. Saugkorb/Armaturen)." },
            { name: "Doppelschlinge gestochen", video: "WaN4_eUFA90", desc: "Formstabile Doppelschlinge zum Halten, Sichern oder Tragen." },
            { name: "Doppelschlinge gelegt", video: "gzuLVhgIlWQ", desc: "Schnelle Vorbereitung der Doppelschlinge zum Aufnehmen von Geräten." },
            { name: "Zimmermannsschlag", video: "nj7EwRKI598", desc: "Sicherer Befestigungsknoten zum Hochziehen von schwerem Holz & Material." },
            { name: "Schotenstich m. Aufziehs.", video: "cZedtIpuSeE", desc: "Wettbewerbsknoten der Jugendfeuerwehr mit schneller Lösefunktion." },
            { name: "Schotenstich o. Aufziehs.", video: "SP3vMCnGyQg", desc: "Zum Verbinden von zwei Leinen (auch unterschiedlicher Stärke)." },
            { name: "Brustbund", video: "8PZoAhc9hFw", desc: "Rettungsbund mit Pfahlstich & Spierenstich zur Menschenrettung." },
            { name: "Achterknoten", video: "fJ8DBdMO8mE", desc: "Sicherheitsknoten mit fester Schlaufe zum Einhängen in Karabiner." },
            { name: "Halbmastwurf", video: "uN95KVRYFkU", desc: "Dynamischer Sicherungsknoten (HMS) zum kontrollierten Sichern & Ablassen." }
        ];

        const canvas = document.getElementById("wheel-canvas");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spin-btn");
        const resultArea = document.getElementById("result-area");
        const knotNameDisplay = document.getElementById("knot-name");
        const knotDescDisplay = document.getElementById("knot-desc");
        const videoBtn = document.getElementById("video-btn");
        const videoModal = document.getElementById("video-modal");
        const iframe = document.getElementById("yt-iframe");
        const closeModal = document.getElementById("close-modal");

        const numSlices = knots.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        let currentRotation = 0;

        // Sound Synthesis via Web Audio API (Ticking effect)
        let audioCtx = null;
        function playTick() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.03);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch (e) {}
        }

        // Draw Canvas Wheel
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSlices; i++) {
                const startAngle = -Math.PI / 2 + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Alternate Dark Premium Colors
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = i % 2 === 0 ? "#b71c1c" : "#1c1c24";
                ctx.fill();

                // Inner Slice Border
                ctx.strokeStyle = "rgba(0,0,0,0.5)";
                ctx.lineWidth = 3;
                ctx.stroke();

                // Slice Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 22px -apple-system, BlinkMacSystemFont, Arial, sans-serif";
                
                let text = knots[i].name;
                ctx.fillText(text, radius - 25, 8);
                ctx.restore();
            }
        }

        drawWheel();

        // Spin Engine
        let lastTickAngle = 0;
        spinBtn.addEventListener("click", () => {
            if (spinBtn.disabled) return;
            
            spinBtn.disabled = true;
            resultArea.classList.remove("show");

            // Random rotation (5 to 8 full spins)
            const spins = (Math.floor(Math.random() * 4) + 5) * 360;
            const randomDegree = Math.floor(Math.random() * 360);
            
            currentRotation += (spins + randomDegree);
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Simulated Ticking Audio während der Drehung
            let tickCount = 0;
            const totalTicks = 28;
            const tickInterval = setInterval(() => {
                playTick();
                tickCount++;
                if (tickCount >= totalTicks) {
                    clearInterval(tickInterval);
                }
            }, 120);
        });

        // Rotation End Handler
        canvas.addEventListener("transitionend", () => {
            spinBtn.disabled = false;

            const normalizedRotation = currentRotation % 360;
            const angleAtTop = (360 - normalizedRotation) % 360;
            const sliceSize = 360 / numSlices;
            const winningIndex = Math.floor(angleAtTop / sliceSize);
            
            const winner = knots[winningIndex];

            knotNameDisplay.textContent = winner.name;
            knotDescDisplay.textContent = winner.desc;
            
            videoBtn.onclick = () => {
                iframe.src = `https://www.youtube.com/embed/${winner.video}?autoplay=1&rel=0`;
                videoModal.style.display = "flex";
            };

            resultArea.classList.add("show");
        });

        // Modal Close Handler
        closeModal.addEventListener("click", () => {
            videoModal.style.display = "none";
            iframe.src = "";
        });

    </script>
</body>
</html>
