    <style>
        :root {
            --bg-color: #0d0d11;
            --card-bg: rgba(25, 25, 35, 0.75);
            --primary-red: #e50914;
            --accent-gold: #ffcc00;
            --text-light: #f5f5f7;
            --text-dim: #a1a1a6;
            --border-glow: rgba(229, 9, 20, 0.3);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(229, 9, 20, 0.15), transparent 70%),
                radial-gradient(circle at 50% 100%, rgba(20, 20, 30, 0.8), transparent 80%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
        }

        header {
            margin-top: calc(env(safe-area-inset-top, 20px) + 15px);
            text-align: center;
            padding: 0 20px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 4px 0;
            background: linear-gradient(180deg, #ffffff 0%, #d1d1d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 500;
            margin: 0;
            letter-spacing: 0.2px;
        }

        /* Navigation Segment Control */
        .nav-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 3px;
            margin: 18px 0 10px 0;
            width: 310px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn.active {
            background: var(--primary-red);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(229, 9, 20, 0.4);
        }

        /* Views */
        .view-content {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .view-content.active {
            display: flex;
        }

        /* Roulette Stage */
        .wheel-stage {
            position: relative;
            margin: 20px auto 15px auto;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-glow {
            position: absolute;
            width: 310px;
            height: 310px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(229, 9, 20, 0.2) 0%, transparent 70%);
            filter: blur(10px);
            z-index: 1;
        }

            height: 32px;
            z-index: 20;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.8));
        }
