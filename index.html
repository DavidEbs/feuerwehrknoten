<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Feuerwehrknoten Roulette & FwDV 1 Nachschlagewerk</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Knoten Roulette">
    <meta name="theme-color" content="#0d0d11">
    
    <!-- Embedded SVG Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%23111118'/><rect x='20' y='20' width='472' height='472' rx='90' fill='none' stroke='%23e50914' stroke-width='16'/><path d='M256 90 L380 180 L380 340 L256 430 L132 340 L132 180 Z' fill='none' stroke='%23e50914' stroke-width='24'/><circle cx='256' cy='250' r='55' fill='none' stroke='%23ffcc00' stroke-width='22'/><path d='M200 250 C200 200, 312 200, 312 250 C312 300, 200 300, 200 250 Z' fill='none' stroke='%23ffffff' stroke-width='16'/></svg>">

    <style>
        :root {
            --bg-color: #0d0d11;
            --card-bg: rgba(25, 25, 35, 0.75);
            --primary-red: #e50914;
            --accent-gold: #ffcc00;
            --text-light: #f5f5f7;
            --text-dim: #a1a1a6;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(229, 9, 20, 0.18), transparent 70%),
                radial-gradient(circle at 50% 100%, rgba(20, 20, 30, 0.8), transparent 80%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Roulette Stage & Canvas */
        .wheel-stage {
            position: relative;
            margin: 15px auto;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-glow {
            position: absolute;
            width: 310px;
            height: 310px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(229, 9, 20, 0.25) 0%, transparent 70%);
            filter: blur(12px);
            z-index: 1;
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 32px;
            z-index: 20;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.8));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 28px solid var(--primary-red);
        }

        #wheel-canvas {
            position: relative;
            z-index: 10;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 0 6px rgba(255, 255, 255, 0.05);
            transition: transform 4.5s cubic-bezier(0.15, 0.85, 0.15, 1);
            transform: rotate(0deg);
        }

        .center-pin {
            position: absolute;
            width: 44px;
            height: 44px;
            background: radial-gradient(circle, #2c2c36 0%, #111116 100%);
            border: 3px solid #3a3a4c;
            border-radius: 50%;
            z-index: 15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-pin::after {
            content: '';
            width: 14px;
            height: 14px;
            background: var(--primary-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary-red);
        }

        /* Result Box Animations */
        #result-area {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            pointer-events: none;
        }

        #result-area.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
    </style>
</head>
<body class="antialiased">

    <header class="w-full max-w-md px-4 text-center mt-6">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-b from-white to-gray-300">
            Feuerwehrknoten
        </h1>
        <p class="text-xs sm:text-sm text-gray-400 font-medium mt-1">
            Roulette & FwDV 1 Nachschlagewerk
        </p>

        <!-- Segmented Navigation Bar -->
        <div class="flex bg-white/10 p-1 rounded-xl mt-4 border border-white/10 max-w-xs mx-auto">
            <button id="tab-roulette" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-red-600 text-white shadow-lg transition-all" onclick="switchView('roulette')">
                🎲 Roulette
            </button>
            <button id="tab-library" class="flex-1 py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-all" onclick="switchView('library')">
                📖 FwDV 1 Bibliothek
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="w-full max-w-md px-4 mt-2 flex flex-col items-center">

        <!-- VIEW 1: ROULETTE STAGE -->
        <section id="roulette-view" class="w-full flex flex-col items-center">
            <div class="wheel-stage">
                <div class="wheel-glow"></div>
                <div class="pointer"></div>
                <canvas id="wheel-canvas" width="600" height="600"></canvas>
                <div class="center-pin"></div>
            </div>

            <!-- Spin Button -->
            <button id="spin-btn" class="w-64 py-4 mt-2 bg-gradient-to-b from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold text-lg rounded-full shadow-lg shadow-red-600/40 border border-red-400/30 active:scale-95 transition-transform duration-150">
                Knoten Drehen
            </button>

            <!-- Spin Result Box -->
            <div id="result-area" class="w-full glass-panel rounded-2xl p-5 text-center mt-5">
                <div class="text-xs font-bold uppercase tracking-widest text-amber-400 mb-1">
                    Ausgewählter Knoten
                </div>
                <div id="knot-name" class="text-xl font-extrabold text-white mb-2"></div>
                <div id="knot-desc" class="text-xs text-gray-300 leading-relaxed mb-4"></div>
                
                <button id="video-btn" class="w-full py-3 bg-white/10 hover:bg-white/20 text-white text-sm font-semibold rounded-xl border border-white/15 flex items-center justify-center gap-2 transition-colors active:scale-98">
                    <span>▶</span> Erklärvideo ansehen
                </button>
            </div>
        </section>

        <!-- VIEW 2: FwDV 1 LIBRARY -->
        <section id="library-view" class="w-full hidden flex-col items-center">
            <!-- Search Bar -->
            <div class="w-full mb-4">
                <input type="text" id="search-input" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-red-500 transition-colors" placeholder="🔍 Knoten oder Verwendungszweck suchen..." oninput="filterLibrary()">
            </div>

            <!-- Knot Cards List -->
            <div id="knot-list" class="w-full flex flex-col gap-3">
                <!-- Dynamic cards populated via JavaScript -->
            </div>
        </section>

    </main>

    <!-- VIDEO MODAL -->
    <div id="video-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex-col justify-center items-center p-4">
        <button id="close-modal" class="absolute top-6 right-6 w-11 h-11 bg-white/10 text-white rounded-full text-2xl flex items-center justify-center hover:bg-white/20 active:scale-95 transition-all">
            &times;
        </button>
        <div class="w-full max-w-xl aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-white/10">
            <iframe id="yt-iframe" class="w-full h-full" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Complete dataset containing all 10 required firefighting knots according to FwDV 1
        const knots = [
            { 
                name: "Mastwurf gestochen", 
                type: "Gestochen",
                video: "_8CKJrBWJTM", 
                start: 0, 
                desc: "Zum Anschlagen an festen Objekten (z. B. Pfahl, Baum oder Geländer) oder zum Sichern der Feuerwehrleine.",
                safety: "⚠️ FwDV 1 Hinweis: Bei Zugbelastung muss das freie Leinenende zusätzlich mit einem Spierenstich gesichert werden!"
            },
            { 
                name: "Mastwurf gelegt", 
                type: "Gelegt",
                video: "gqkZywQvbWg", 
                start: 0, 
                desc: "Zum Anschlagen an offenen Leitungsenden, Armaturen oder Geräten (z. B. Saugkorb/Saugstrahlrohr).",
                safety: "⚠️ Hinweis: Wird um den Saugkorb gelegt und mit Halbschlag zur Ventilabsicherung ergänzt."
            },
            { 
                name: "Doppelschlinge gestochen", 
                type: "Gestochen",
                video: "WaN4_eUFA90", 
                start: 0, 
                desc: "Formstabile Doppelschlinge zum Halten, Sichern oder Aufziehen schwerer Gegenstände und Leitern.",
                safety: "⚠️ Hinweis: Beide Schlingen müssen gleichmäßig verteilt belastet werden."
            },
            { 
                name: "Doppelschlinge gelegt", 
                type: "Gelegt",
                video: "gzuLVhgIlWQ", 
                start: 0, 
                desc: "Schnelles Vorbereiten der Doppelschlinge zum Aufnehmen von Geräten (z. B. Strahlrohr mit Schlauch).",
                safety: "⚠️ Hinweis: Vor dem Anheben auf richtigen Sitz und parallelen Leinenverlauf prüfen."
            },
            { 
                name: "Zimmermannsschlag", 
                type: "Befestigung",
                video: "nj7EwRKI598", 
                start: 0, 
                desc: "Befestigungsknoten zum Hochziehen von langem Rundholz, Ästen oder Saugschläuchen.",
                safety: "⚠️ FwDV 1 Hinweis: Nur auf Zug belastbar! Muss sich nach Entlastung leicht wieder lösen lassen."
            },
            { 
                name: "Schotenstich m. Aufziehs.", 
                type: "Wettbewerb / Jugend",
                video: "cZedtIpuSeE", 
                start: 180, 
                desc: "Verbindung zweier Leinen (auch unterschiedlicher Stärke) mit schneller Lösefunktion im Wettbewerb.",
                safety: "⚠️ Jugendfeuerwehr-Reglement: Die Aufziehschlaufe muss ordnungsgemäß gesteckt sein, um Punkteabzug zu vermeiden."
            },
            { 
                name: "Schotenstich o. Aufziehs.", 
                type: "Standard",
                video: "SP3vMCnGyQg", 
                start: 0, 
                desc: "Zum sicheren Verbinden von zwei Leinen gleicher oder unterschiedlicher Stärke.",
                safety: "⚠️ FwDV 1 Hinweis: Nicht zur Personensicherung zugelassen!"
            },
            { 
                name: "Brustbund", 
                type: "Rettung / Sicherung",
                video: "8PZoAhc9hFw", 
                start: 0, 
                desc: "Rettungsbund mit Pfahlstich und Spierenstich zur Selbstrettung oder Personensicherung.",
                safety: "⚠️ FwDV 1 Vorschrift: Ausführung zwingend mit Pfahlstich & Sicherung durch Spierenstich!"
            },
            { 
                name: "Achterknoten", 
                type: "Sicherung",
                video: "fJ8DBdMO8mE", 
                start: 0, 
                desc: "Sicherheitsknoten zum Einbinden oder als Stoppknoten am Leinenende gegen Durchrutschen.",
                safety: "⚠️ FwDV 1 Hinweis: Standardknoten zur Sicherung in Karabinern bei der Personensicherung."
            },
            { 
                name: "Halbmastwurf", 
                type: "Dynamische Sicherung",
                video: "uN95KVRYFkU", 
                start: 0, 
                desc: "Dynamischer Sicherungsknoten (HMS) zum kontrollierten Sichern und Ablassen von Personen oder Lasten.",
                safety: "⚠️ FwDV 1 Vorschrift: Nur in Verbindung mit HMS-Karabiner mit Schraub-/Autolock-Sicherung verwenden!"
            }
        ];

        const canvas = document.getElementById("wheel-canvas");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spin-btn");
        const resultArea = document.getElementById("result-area");
        const knotNameDisplay = document.getElementById("knot-name");
        const knotDescDisplay = document.getElementById("knot-desc");
        const videoBtn = document.getElementById("video-btn");
        const videoModal = document.getElementById("video-modal");
        const iframe = document.getElementById("yt-iframe");
        const closeModal = document.getElementById("close-modal");
        const knotListContainer = document.getElementById("knot-list");

        const numSlices = knots.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        let currentRotation = 0;

        function switchView(view) {
            const tabRoulette = document.getElementById('tab-roulette');
            const tabLibrary = document.getElementById('tab-library');
            const rouletteView = document.getElementById('roulette-view');
            const libraryView = document.getElementById('library-view');

            if (view === 'roulette') {
                tabRoulette.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-red-600 text-white shadow-lg transition-all";
                tabLibrary.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-all";
                rouletteView.classList.remove('hidden');
                libraryView.classList.add('hidden');
                libraryView.classList.remove('flex');
            } else {
                tabLibrary.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-red-600 text-white shadow-lg transition-all";
                tabRoulette.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-all";
                rouletteView.classList.add('hidden');
                libraryView.classList.remove('hidden');
                libraryView.classList.add('flex');
                renderLibrary(knots);
            }
        }

        let audioCtx = null;
        function playTickSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(580, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.035);
                
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.035);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.035);
            } catch (e) {
                // Audio not allowed or unsupported
            }
        }

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX - 12;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSlices; i++) {
                const startAngle = -Math.PI / 2 + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Wedge segment
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = i % 2 === 0 ? "#b71c1c" : "#1c1c24";
                ctx.fill();

                // Wedge border
                ctx.strokeStyle = "rgba(0,0,0,0.5)";
                ctx.lineWidth = 4;
                ctx.stroke();

                // Text label
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 21px -apple-system, BlinkMacSystemFont, Arial, sans-serif";
                
                ctx.fillText(knots[i].name, radius - 25, 7);
                ctx.restore();
            }
        }

        drawWheel();

        spinBtn.addEventListener("click", () => {
            if (spinBtn.disabled) return;
            
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');
            resultArea.classList.remove("show");

            const extraSpins = (Math.floor(Math.random() * 4) + 5) * 360;
            const randomOffset = Math.floor(Math.random() * 360);
            
            currentRotation += (extraSpins + randomOffset);
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Audio tick sequence
            let tickCount = 0;
            const totalTicks = 28;
            const tickInterval = setInterval(() => {
                playTickSound();
                tickCount++;
                if (tickCount >= totalTicks) {
                    clearInterval(tickInterval);
                }
            }, 120);
        });

        canvas.addEventListener("transitionend", () => {
            spinBtn.disabled = false;
            spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            const normalizedRotation = currentRotation % 360;
            const angleAtTop = (360 - normalizedRotation) % 360;
            const sliceSize = 360 / numSlices;
            const winningIndex = Math.floor(angleAtTop / sliceSize);
            
            const winner = knots[winningIndex];

            knotNameDisplay.textContent = winner.name;
            knotDescDisplay.textContent = winner.desc;
            
            videoBtn.onclick = () => openVideoModal(winner.video, winner.start);

            resultArea.classList.add("show");
        });

        function openVideoModal(videoId, startSeconds = 0) {
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&start=${startSeconds}`;
            videoModal.classList.remove("hidden");
            videoModal.classList.add("flex");
        }

        closeModal.addEventListener("click", () => {
            videoModal.classList.add("hidden");
            videoModal.classList.remove("flex");
            iframe.src = "";
        });

        videoModal.addEventListener("click", (e) => {
            if (e.target === videoModal) {
                closeModal.click();
            }
        });

        function renderLibrary(items) {
            knotListContainer.innerHTML = "";
            items.forEach(knot => {
                const card = document.createElement("div");
                card.className = "glass-panel rounded-2xl p-4 text-left transition-all hover:border-white/20";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-base font-bold text-white">${knot.name}</h3>
                        <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-red-600/20 text-red-400 border border-red-500/30">
                            ${knot.type}
                        </span>
                    </div>
                    <p class="text-xs text-gray-300 leading-relaxed mb-3">${knot.desc}</p>
                    <div class="text-[11px] bg-amber-500/10 border-l-2 border-amber-400 text-amber-300 p-2 rounded-r-lg mb-3 leading-snug">
                        ${knot.safety}
                    </div>
                    <button class="w-full py-2.5 bg-white/10 hover:bg-white/20 text-white text-xs font-semibold rounded-xl border border-white/10 flex items-center justify-center gap-2 transition-colors active:scale-98" onclick="openVideoModal('${knot.video}', ${knot.start})">
                        <span>▶</span> Erklärvideo ${knot.start > 0 ? `(ab ${Math.floor(knot.start/60)}:00 min)` : ''}
                    </button>
                `;
                knotListContainer.appendChild(card);
            });
        }

        function filterLibrary() {
            const query = document.getElementById("search-input").value.toLowerCase().trim();
            const filtered = knots.filter(k => 
                k.name.toLowerCase().includes(query) || 
                k.desc.toLowerCase().includes(query) || 
                k.type.toLowerCase().includes(query)
            );
            renderLibrary(filtered);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'fw-knoten-v2';
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                    });
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                const blobUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(blobUrl).catch(() => {});
            });
        }
    </script>
</body>
</html>
