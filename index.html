            z-index: 20;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.8));

        .pointer::after {
            content: '';

            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;

        const knots = [

            },
            {

                type: "Standard",
                video: "SP3vMCnGyQg", 
                start: 0, 
                desc: "Zum sicheren Verbinden von zwei Leinen gleicher oder unterschiedlicher Stärke.",
                safety: "⚠️ FwDV 1 Hinweis: Nicht zur Personensicherung zugelassen!"
            },
            { 
                name: "Brustbund", 
                type: "Rettung / Sicherung",
                video: "8PZoAhc9hFw", 
                start: 0, 
                desc: "Rettungsbund mit Pfahlstich und Spierenstich zur Selbstrettung oder Personensicherung.",
                safety: "⚠️ FwDV 1 Vorschrift: Ausführung zwingend mit Pfahlstich & Sicherung durch Spierenstich!"
            },
            {

                type: "Sicherung",
                video: "fJ8DBdMO8mE", 
                start: 0, 
                desc: "Sicherheitsknoten zum Einbinden oder als Stoppknoten am Leinenende gegen Durchrutschen.",
                safety: "⚠️ FwDV 1 Hinweis: Standardknoten zur Sicherung in Karabinern bei der Personensicherung."
            },
            { 
                name: "Halbmastwurf", 
                type: "Dynamische Sicherung",
                video: "uN95KVRYFkU", 
                start: 0, 
                desc: "Dynamischer Sicherungsknoten (HMS) zum kontrollierten Sichern und Ablassen von Personen oder Lasten.",
                safety: "⚠️ FwDV 1 Vorschrift: Nur in Verbindung mit HMS-Karabiner mit Schraub-/Autolock-Sicherung verwenden!"
            }
        ];

        const canvas = document.getElementById("wheel-canvas");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spin-btn");
        const resultArea = document.getElementById("result-area");
        const knotNameDisplay = document.getElementById("knot-name");
        const knotDescDisplay = document.getElementById("knot-desc");
        const videoBtn = document.getElementById("video-btn");
        const videoModal = document.getElementById("video-modal");
        const closeModal = document.getElementById("close-modal");
        const knotListContainer = document.getElementById("knot-list");
        const errorFallback = document.getElementById("error-fallback");
        const externalYtLink = document.getElementById("external-yt-link");
        const audioToggleBtn = document.getElementById("audio-toggle-btn");

        const numSlices = knots.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        let currentRotation = 0;

        let player = null;
        let isApiReady = false;
        let currentVideoId = "";

        function onYouTubeIframeAPIReady() {
            isApiReady = true;
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'playsinline': 1,
                    'rel': 0,
                    'origin': window.location.origin || '*'
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            event.target.mute();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.BUFFERING) {
                if (player && player.isMuted && !player.isMuted()) {
                    player.mute();
                }
            }
        }

        function onPlayerError(event) {
            if ([2, 5, 100, 101, 150, 153].includes(event.data)) {
                errorFallback.style.display = "flex";
                externalYtLink.href = `https://www.youtube.com/watch?v=${currentVideoId}`;
            }
        }

        function switchView(view) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));

            if (view === 'roulette') {
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
                document.getElementById('roulette-view').classList.add('active');
            } else {
                document.querySelectorAll('.nav-btn')[1].classList.add('active');
                document.getElementById('library-view').classList.add('active');
                renderLibrary(knots);
            }
        }

        let audioCtx = null;
        function playTick() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.03);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch (e) {}
        }

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSlices; i++) {
                const startAngle = -Math.PI / 2 + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = i % 2 === 0 ? "#b71c1c" : "#1c1c24";
                ctx.fill();

                ctx.strokeStyle = "rgba(0,0,0,0.5)";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 21px -apple-system, BlinkMacSystemFont, Arial, sans-serif";
                
                ctx.fillText(knots[i].name, radius - 25, 7);
                ctx.restore();
            }
        }

        drawWheel();

        spinBtn.addEventListener("click", () => {
            if (spinBtn.disabled) return;
            
            spinBtn.disabled = true;
            resultArea.classList.remove("show");

            const spins = (Math.floor(Math.random() * 4) + 5) * 360;
            const randomDegree = Math.floor(Math.random() * 360);
            
            currentRotation += (spins + randomDegree);
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            let tickCount = 0;
            const totalTicks = 28;
            const tickInterval = setInterval(() => {
                playTick();
                tickCount++;
                if (tickCount >= totalTicks) {
                    clearInterval(tickInterval);
                }
            }, 120);
        });

        canvas.addEventListener("transitionend", () => {
            spinBtn.disabled = false;

            const normalizedRotation = currentRotation % 360;
            const angleAtTop = (360 - normalizedRotation) % 360;
            const sliceSize = 360 / numSlices;
            const winningIndex = Math.floor(angleAtTop / sliceSize);
            
            const winner = knots[winningIndex];

            knotNameDisplay.textContent = winner.name;
            knotDescDisplay.textContent = winner.desc;
            
            videoBtn.onclick = () => openVideo(winner.video, winner.start);

            resultArea.classList.add("show");
        });

        function openVideo(videoId, startSeconds = 0) {
            currentVideoId = videoId;
            errorFallback.style.display = "none";
            videoModal.style.display = "flex";
            
            audioToggleBtn.textContent = "🔇 Ton ist stummgeschaltet – Tippen für Ton";

            if (isApiReady && player && typeof player.loadVideoById === 'function') {
                player.mute();
                player.loadVideoById({
                    videoId: videoId,
                    startSeconds: startSeconds
                });
            }
        }

        function toggleAudio() {
            if (player && typeof player.isMuted === 'function') {
                if (player.isMuted()) {
                    player.unMute();
                    audioToggleBtn.textContent = "🔊 Ton ist AN – Tippen für Stumm";
                } else {
                    player.mute();
                    audioToggleBtn.textContent = "🔇 Ton ist stummgeschaltet – Tippen für Ton";
                }
            }
        }

        closeModal.addEventListener("click", () => {
            videoModal.style.display = "none";
            if (player && typeof player.stopVideo === 'function') {
                player.stopVideo();
            }
        });

        function renderLibrary(items) {
            knotListContainer.innerHTML = "";
            items.forEach(knot => {
                const card = document.createElement("div");
                card.className = "knot-card";
                card.innerHTML = `
                    <div class="knot-card-header">
                        <div class="knot-title">${knot.name}</div>
                        <div class="knot-badge">${knot.type}</div>
                    </div>
                    <div class="knot-detail">${knot.desc}</div>
                    <div class="safety-note">${knot.safety}</div>
                    <button class="video-btn" onclick="openVideo('${knot.video}', ${knot.start})">
                        ▶ Erklärvideo abspielen ${knot.start > 0 ? `(ab ${Math.floor(knot.start/60)}:00 min)` : ''}
                    </button>
                `;
                knotListContainer.appendChild(card);
            });
        }

        function filterLibrary() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const filtered = knots.filter(k => 
                k.name.toLowerCase().includes(query) || 
                k.desc.toLowerCase().includes(query) || 
                k.type.toLowerCase().includes(query)
            );
            renderLibrary(filtered);
        }
    </script>
</body>
</html>
